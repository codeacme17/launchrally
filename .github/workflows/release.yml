name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Protected annotated Stable release tag
        required: true
        type: string
      promotion_pr:
        description: Open Stable promotion PR targeting main
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_state:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_status: ${{ steps.contract.outputs.release_status }}
    steps:
      - uses: actions/checkout@v6
      - id: contract
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'release_status=' + require('./release/p0.json').release_status + '\n')"

  contracts:
    needs: release_state
    if: github.event_name == 'push' && needs.release_state.outputs.release_status == 'experimental'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.12.0, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - run: npm run test:contracts
      - run: npm run validate:acceptance

  journeys:
    needs: release_state
    if: github.event_name == 'push' && needs.release_state.outputs.release_status == 'experimental'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.12.0
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - run: npm run test:journeys
      - run: npm run test:artifacts

  publish:
    needs: [contracts, journeys]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm Trusted Publishing client
        run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify generated Plugin bundles are committed
        run: git diff --exit-code
      - run: npm test
      - run: npm run validate:acceptance -- --require-release-ready
      - run: npm run validate:p0
      - run: npm run validate:release -- --tag "$GITHUB_REF_NAME"
      - run: npm run validate:release-ref -- --tag "$GITHUB_REF_NAME"
      - run: npm run test:artifacts
      - run: npm run test:legacy-public
      - name: Publish public packages with provenance
        run: node scripts/publish-release.mjs

  public-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm attestation verification client
        run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify exact public CLI and Plugin journeys
        run: npm run test:public-release -- --json

  prerelease:
    needs: public-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create Experimental GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --generate-notes --title "LaunchRally $GITHUB_REF_NAME (Experimental)"

  stable-promotion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      PROMOTION_TAG: ${{ inputs.tag }}
      PROMOTION_PR: ${{ inputs.promotion_pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm Trusted Publishing client
        run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify generated Plugin bundles are committed
        run: git diff --exit-code
      - run: npm test
      - run: npm run validate:acceptance -- --require-stable-ready
      - run: npm run validate:p0
      - run: npm run validate:release -- --tag "$PROMOTION_TAG"
      - run: npm run validate:release-ref -- --tag "$PROMOTION_TAG" --allow-promotion-head
      - run: npm run test:artifacts
      - name: Verify the unmerged Stable promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh pr view "$PROMOTION_PR" --json baseRefName --jq .baseRefName)" = "main"
          test "$(gh pr view "$PROMOTION_PR" --json headRefOid --jq .headRefOid)" = "$(git rev-parse HEAD)"
          test "$(gh pr view "$PROMOTION_PR" --json state --jq .state)" = "OPEN"
          test "$(gh pr view "$PROMOTION_PR" --json mergeable --jq .mergeable)" = "MERGEABLE"
          test "$(gh pr view "$PROMOTION_PR" --json mergeStateStatus --jq .mergeStateStatus)" = "CLEAN"
          test "$(gh pr view "$PROMOTION_PR" --json reviewDecision --jq .reviewDecision)" = "APPROVED"
      - name: Publish and verify the approved Stable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-stable.mjs --tag "$PROMOTION_TAG" --phase publish
      - name: Merge Stable claims only after public verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr view "$PROMOTION_PR" --json state --jq .state)" = "OPEN" ]; then
            gh pr merge "$PROMOTION_PR" --merge --match-head-commit "$(git rev-parse HEAD)"
          fi
          test "$(gh pr view "$PROMOTION_PR" --json state --jq .state)" = "MERGED"
      - name: Announce the verified Stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-stable.mjs --tag "$PROMOTION_TAG" --phase announce
