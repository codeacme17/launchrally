name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.12.0, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - run: npm run test:contracts
      - run: npm run validate:acceptance

  journeys:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.12.0
            target: linux-node20-posix
          - os: ubuntu-latest
            node: 22
            target: linux-node22-posix
          - os: ubuntu-latest
            node: 24
            target: linux-node24-posix
          - os: macos-latest
            node: 22
            target: macos-node22-posix
          - os: windows-latest
            node: 22
            target: windows-node22-powershell
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - run: npm run test:journeys
      - run: npm run test:artifacts -- --matrix-target "${{ matrix.target }}"

  quality-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code
      - run: npm test
      - run: npm run test:legacy-public
      - run: npm run validate:acceptance
      - if: github.event_name == 'pull_request'
        run: git fetch origin "$GITHUB_BASE_REF" --depth=1
      - if: github.event_name == 'pull_request'
        run: npm run validate:p0 -- --baseline-ref "origin/$GITHUB_BASE_REF"
      - if: github.event_name == 'pull_request'
        run: npm run validate:p1 -- --baseline-ref "origin/$GITHUB_BASE_REF"
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch origin "${{ github.event.before }}" --depth=1
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run validate:p0 -- --baseline-ref "${{ github.event.before }}"
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run validate:p1 -- --baseline-ref "${{ github.event.before }}"
      - if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: npm run validate:p0
      - if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: npm run validate:p1
      - run: npm run validate:release
